name: CI & Quality Pipeline

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: write

jobs:
  # ─── 1. Branch Flow Validation ──────────────────────────────────────────────
  validate-branch:
    name: Validate PR Source Branch
    runs-on: ubuntu-latest
    steps:
      - name: Check Branch Flow
        run: |
          TARGET_BRANCH="${{ github.base_ref }}"
          SOURCE_BRANCH="${{ github.head_ref }}"

          echo "Target Branch: $TARGET_BRANCH"
          echo "Source Branch: $SOURCE_BRANCH"

          if [ "$TARGET_BRANCH" = "main" ]; then
            if [ "$SOURCE_BRANCH" != "dev" ] && ! [[ "$SOURCE_BRANCH" =~ ^hotfix/ ]]; then
              echo "::error::Only 'dev' or 'hotfix/*' branches are allowed to create Pull Requests targeting 'main'."
              echo "Source branch was '$SOURCE_BRANCH'."
              exit 1
            fi
            echo "PR source branch '$SOURCE_BRANCH' is valid for target 'main'."
          elif [ "$TARGET_BRANCH" = "dev" ]; then
            if ! [[ "$SOURCE_BRANCH" =~ ^feature/ ]] && \
               ! [[ "$SOURCE_BRANCH" =~ ^bugfix/ ]] && \
               ! [[ "$SOURCE_BRANCH" =~ ^docs/ ]] && \
               ! [[ "$SOURCE_BRANCH" =~ ^refactor/ ]]; then
              echo "::error::Only 'feature/*', 'bugfix/*', 'docs/*', or 'refactor/*' branches are allowed to create Pull Requests targeting 'dev'."
              echo "Source branch was '$SOURCE_BRANCH'."
              exit 1
            fi
            echo "PR source branch '$SOURCE_BRANCH' is valid for target 'dev'."
          fi

  # ─── 2. Changes Filter (Targeted execution) ──────────────────────────────────
  filter-changes:
    name: Detect Changed Areas
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - 'docker-compose.yml'
              - '.github/workflows/**'

  # ─── 3. Backend Quality & Tests (Only if backend changed) ────────────────────
  backend-quality-tests:
    name: Backend Tests & Quality
    needs: filter-changes
    if: needs.filter-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest Suite
        working-directory: backend
        run: |
          pytest -v

  # ─── 4. Frontend Quality & Tests (Only if frontend changed) ───────────────────
  frontend-quality-tests:
    name: Frontend Quality & Tests
    needs: filter-changes
    if: needs.filter-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint & Code Quality Check
        working-directory: frontend
        run: npm run lint

      - name: Type Check
        working-directory: frontend
        run: npm run type-check

      - name: Run Unit Tests
        working-directory: frontend
        run: npm run test:unit -- --run

      - name: Production Build Check
        working-directory: frontend
        run: npm run build-only

  # ─── 5. Containerization Check ──────────────────────────────────────────────
  containerization:
    name: Verify Container Build & Compose
    needs: filter-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create .env for build verification
        run: cp .env.example .env

      - name: Build Docker Containers
        run: |
          docker compose build
